packages:
  - packages/*
  - services/*
  - services/*/engines/*

allowBuilds:
  core-js: false
  esbuild: true
  lightningcss: true
  msw: false
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - undici-types@6.21.0

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
  vitest: 4.1.10

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - "@firecrawl/anydoc-darwin-arm64@0.1.1"
  - "@firecrawl/anydoc-darwin-x64@0.1.1"
  - "@firecrawl/anydoc-linux-arm64-gnu@0.1.1"
  - "@firecrawl/anydoc-linux-arm64-musl@0.1.1"
  - "@firecrawl/anydoc-linux-x64-gnu@0.1.1"
  - "@firecrawl/anydoc-linux-x64-musl@0.1.1"
  - "@firecrawl/anydoc-win32-x64-msvc@0.1.1"
  - "@firecrawl/anydoc@0.1.1"
