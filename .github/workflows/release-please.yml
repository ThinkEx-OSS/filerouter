name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Update release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true
      - name: Verify release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          head_branch=$(jq --exit-status --raw-output '.headBranchName' <<< "$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head_branch"
